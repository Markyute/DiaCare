name: diacare
description: DiaCare - Barangay Health Worker Diabetes Monitoring App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  uuid: ^4.5.1
  fl_chart: ^0.68.0
  crypto: ^3.0.3
  flutter_local_notifications: ^17.2.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  path_provider: ^2.1.6
  # Firebase Cloud Messaging — for server/BHN-originated push alerts, once
  # the backend exists. Local notifications (above) remain the channel for
  # alerts generated entirely on-device (offline risk classification).
  # Requires running `flutterfire configure` to generate
  # lib/firebase_options.dart before this will initialize successfully —
  # see the comment in lib/services/fcm_service.dart.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
